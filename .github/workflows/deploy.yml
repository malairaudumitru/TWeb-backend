name: Deploy to DigitalOcean

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: 178.128.201.144
          username: root
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /app
            git pull
            dotnet publish MedicalCabinetWeb.Api/MedicalCabinetWeb.Api.csproj -c Release -o /app/publish
            systemctl restart medicare-backend